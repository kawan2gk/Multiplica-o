
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prática de Multiplicação</title>

<style>
:root {
    --red: #dc2626;
    --yellow: #facc15;
    --green: #16a34a;
    --dark: #172554;
    --bg: #f1f5f9;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: #1e293b;
}

header {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0 0 10px;
    font-size: 28px;
}

header p {
    margin: 0;
}

main {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 15px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
}

.card {
    border: none;
    border-radius: 12px;
    padding: 15px 10px;
    text-align: center;
    cursor: pointer;
    color: white;
    background: var(--red);
    box-shadow: 0 3px 6px #0002;
    transition: transform .2s, box-shadow .2s;
}

.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 12px #0003;
}

.card.yellow {
    background: var(--yellow);
    color: #422006;
}

.card.green {
    background: var(--green);
    color: white;
}

.card h2 {
    font-size: 24px;
    margin: 0 0 10px;
}

.card .preview {
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 10px;
}

.card .status {
    font-size: 12px;
    font-weight: bold;
    border-top: 1px solid #ffffff55;
    padding-top: 8px;
}

.info-card {
    grid-column: span 2;
    background: #dbeafe;
    color: #1e3a8a;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.info-card h3 {
    margin: 0 0 10px;
}

.practice-errors {
    grid-column: span 3;
    background: #7c3aed;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    font-size: 17px;
    font-weight: bold;
}

.practice-errors:hover {
    background: #6d28d9;
}

#practice {
    display: none;
    max-width: 650px;
    margin: 30px auto;
    background: white;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 5px 20px #0001;
    text-align: center;
}

#practice h2 {
    margin-top: 0;
}

.progress {
    height: 10px;
    background: #e2e8f0;
    border-radius: 10px;
    overflow: hidden;
    margin: 20px 0;
}

#progressBar {
    width: 0%;
    height: 100%;
    background: #2563eb;
    transition: width .3s;
}

#question {
    font-size: 42px;
    font-weight: bold;
    margin: 25px 0;
}

#answer {
    width: 100%;
    max-width: 250px;
    padding: 15px;
    font-size: 24px;
    text-align: center;
    border: 2px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
}

#answer:focus {
    border-color: #2563eb;
}

#feedback {
    min-height: 35px;
    font-size: 18px;
    font-weight: bold;
    margin: 15px 0;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-secondary {
    background: #e2e8f0;
    color: #1e293b;
}

#result {
    display: none;
}

#result h2 {
    font-size: 28px;
}

#resultScore {
    font-size: 22px;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 25px;
    margin-top: 30px;
    background: #172554;
    color: white;
}

@media (max-width: 800px) {
    .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .practice-errors,
    .info-card {
        grid-column: span 3;
    }
}

@media (max-width: 480px) {
    .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .practice-errors,
    .info-card {
        grid-column: span 2;
    }

    header h1 {
        font-size: 22px;
    }

    #question {
        font-size: 34px;
    }
}
</style>
</head>

<body>

<header>
    <h1>✖ Prática de Multiplicação</h1>
    <p>Aprenda, pratique e domine a tabuada do 0 ao 10!</p>
</header>

<main>

    <h2>📚 Escolha uma tabuada para estudar</h2>

    <div class="grid" id="grid"></div>

    <section id="practice">

        <h2 id="practiceTitle">Tabuada</h2>

        <p id="questionCount"></p>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <div id="question"></div>

        <input
            type="number"
            id="answer"
            placeholder="Sua resposta"
            autocomplete="off"
        >

        <div id="feedback"></div>

        <div class="actions">
            <button class="btn btn-primary" id="checkBtn">
                Conferir resposta
            </button>

            <button class="btn btn-secondary" id="backBtn">
                Voltar ao início
            </button>
        </div>

        <div id="result">
            <h2>🎉 Prática concluída!</h2>
            <p id="resultScore"></p>
            <p id="resultMessage"></p>

            <div class="actions">
                <button class="btn btn-primary" id="retryBtn">
                    Praticar novamente
                </button>

                <button class="btn btn-secondary" id="homeBtn">
                    Voltar ao início
                </button>
            </div>
        </div>

    </section>

</main>

<footer>
    Desenvolvido: Prof. Gabriel Kawan
</footer>

<script>
const grid = document.getElementById("grid");
const practice = document.getElementById("practice");
const question = document.getElementById("question");
const answer = document.getElementById("answer");
const feedback = document.getElementById("feedback");
const questionCount = document.getElementById("questionCount");
const progressBar = document.getElementById("progressBar");
const checkBtn = document.getElementById("checkBtn");
const result = document.getElementById("result");

let currentTable = 1;
let questions = [];
let currentIndex = 0;
let correct = 0;
let mistakes = [];
let wrongCounts = {};
let errorQuestions = [];

// Recupera o progresso salvo no navegador
let progress = JSON.parse(
    localStorage.getItem("tabuadaProgress") || "{}"
);

let allErrors = JSON.parse(
    localStorage.getItem("tabuadaErrors") || "{}"
);

// Cria as tabuadas
function createGrid() {
    grid.innerHTML = "";

    for (let n = 1; n <= 10; n++) {

        const card = document.createElement("button");
        card.className = "card";
        card.id = "card-" + n;

        // Prévia com perguntas e soluções
        let preview = "";

        for (let i = 0; i <= 10; i++) {
            preview += `${n} × ${i} = ${n * i}<br>`;
        }

        card.innerHTML = `
            <h2>Tabuada do ${n}</h2>
            <div class="preview">${preview}</div>
            <div class="status" id="status-${n}">
                Ainda não praticada
            </div>
        `;

        card.onclick = () => startPractice(n);

        grid.appendChild(card);
    }

    // Terceira linha: prática dos erros
    const errorCard = document.createElement("button");

    errorCard.className = "practice-errors";

    errorCard.innerHTML = `
        🔁 Praticar questões com mais erros
        <br>
        <small>Reforce o que precisa aprender!</small>
    `;

    errorCard.onclick = startErrorPractice;

    grid.appendChild(errorCard);

    // Informativo
    const info = document.createElement("div");

    info.className = "info-card";

    info.innerHTML = `
        <h3>🏆 Nosso objetivo!</h3>
        <p>
            Deixe todas as tabuadas na cor Verde
            acertando tudo!
        </p>
        <p>
            Vermelho: precisa praticar.<br>
            Amarelo: acertou pelo menos a metade.<br>
            Verde: acertou todas as questões.
        </p>
    `;

    grid.appendChild(info);

    updateCards();
}

// Atualiza as cores e o desempenho
function updateCards() {

    for (let n = 1; n <= 10; n++) {

        const card = document.getElementById("card-" + n);
        const status = document.getElementById("status-" + n);

        card.classList.remove("yellow", "green");

        const data = progress[n];

        if (!data) {
            status.innerText = "Ainda não praticada";
            continue;
        }

        if (data.percentage === 100) {
            card.classList.add("green");
            status.innerText = "100% de acertos! 🏆";
        } else if (data.percentage >= 50) {
            card.classList.add("yellow");
            status.innerText = data.percentage + "% de acertos";
        } else {
            status.innerText = data.percentage + "% de acertos";
        }
    }
}

// Embaralha as questões
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];
    }

    return array;
}

// Inicia a prática de uma tabuada
function startPractice(n) {

    currentTable = n;

    questions = [];

    // Duas repetições de 0 a 10
    for (let repetition = 0; repetition < 2; repetition++) {

        for (let i = 0; i <= 10; i++) {

            questions.push({
                a: n,
                b: i,
                answer: n * i
            });
        }
    }

    questions = shuffle(questions);

    startSession();
}

// Inicia a prática de erros
function startErrorPractice() {

    errorQuestions = [];

    // Seleciona as questões que o aluno mais errou
    const sortedErrors = Object.entries(allErrors)
        .sort((a, b) => b[1] - a[1]);

    if (sortedErrors.length === 0) {
        alert("Ainda não há erros registrados. Pratique uma tabuada primeiro!");
        return;
    }

    // As 10 questões com mais erros
    const selected = sortedErrors.slice(0, 10);

    selected.forEach(([key, count]) => {

        const [a, b] = key.split("x").map(Number);

        // Duas repetições das questões selecionadas
        for (let i = 0; i < 2; i++) {

            errorQuestions.push({
                a,
                b,
                answer: a * b
            });
        }
    });

    questions = shuffle(errorQuestions);

    currentTable = null;

    startSession();
}

// Inicia uma sessão
function startSession() {

    currentIndex = 0;
    correct = 0;
    mistakes = [];
    wrongCounts = {};

    grid.style.display = "none";
    practice.style.display = "block";
    result.style.display = "none";

    document.getElementById("practiceTitle").innerText =
        currentTable
        ? "Tabuada do " + currentTable
        : "Prática das questões com mais erros";

    checkBtn.style.display = "inline-block";
    answer.style.display = "inline-block";

    showQuestion();

    practice.scrollIntoView({
        behavior: "smooth"
    });
}

// Exibe a questão atual
function showQuestion() {

    const q = questions[currentIndex];

    question.innerText = `${q.a} × ${q.b} = ?`;

    questionCount.innerText =
        `Questão ${currentIndex + 1} de ${questions.length}`;

    progressBar.style.width =
        (currentIndex / questions.length * 100) + "%";

    answer.value = "";
    feedback.innerText = "";
    answer.focus();
}

// Confere a resposta
function checkAnswer() {

    if (currentIndex >= questions.length) return;

    const userAnswer = answer.value;

    if (userAnswer === "") {
        feedback.innerText = "Digite sua resposta!";
        feedback.style.color = "#dc2626";
        return;
    }

    const q = questions[currentIndex];
    const key = `${q.a}x${q.b}`;

    if (Number(userAnswer) === q.answer) {

        correct++;

        feedback.innerText = "Muito bem! Resposta correta! 🎉";
        feedback.style.color = "#16a34a";

    } else {

        mistakes.push(q);

        wrongCounts[key] = (wrongCounts[key] || 0) + 1;

        allErrors[key] = (allErrors[key] || 0) + 1;

        feedback.innerText =
            `Ops! A resposta correta é ${q.answer}.`;

        feedback.style.color = "#dc2626";
    }

    // Atualiza os erros salvos
    localStorage.setItem(
        "tabuadaErrors",
        JSON.stringify(allErrors)
    );

    checkBtn.style.display = "none";

    setTimeout(() => {

        currentIndex++;

        if (currentIndex < questions.length) {

            checkBtn.style.display = "inline-block";

            showQuestion();

        } else {

            finishPractice();
        }

    }, 1000);
}

// Finaliza a prática
function finishPractice() {

    const percentage = Math.round(
        (correct / questions.length) * 100
    );

    progressBar.style.width = "100%";

    questionCount.innerText = "Prática concluída!";

    question.innerText = "🏁";

    answer.style.display = "none";
    checkBtn.style.display = "none";

    result.style.display = "block";

    document.getElementById("resultScore").innerText =
        `${correct} de ${questions.length} acertos (${percentage}%)`;

    let message = "";

    if (percentage === 100) {

        message = "Excelente! Você acertou tudo!";

    } else if (percentage >= 50) {

        message = "Muito bem! Continue praticando para chegar ao verde!";

    } else {

        message = "Não desista! A prática leva à perfeição.";
    }

    document.getElementById("resultMessage").innerText = message;

    // Salva o desempenho da tabuada
    if (currentTable !== null) {

        const previous = progress[currentTable];

        // Mantém o melhor resultado alcançado
        if (!previous || percentage > previous.percentage) {

            progress[currentTable] = {
                percentage,
                correct,
                total: questions.length
            };
        }

        localStorage.setItem(
            "tabuadaProgress",
            JSON.stringify(progress)
        );
    }

    updateCards();
}

// Eventos
checkBtn.onclick = checkAnswer;

answer.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        checkAnswer();
    }
});

document.getElementById("backBtn").onclick = goHome;
document.getElementById("homeBtn").onclick = goHome;

document.getElementById("retryBtn").onclick = function() {

    if (currentTable !== null) {

        startPractice(currentTable);

    } else {

        startErrorPractice();
    }
};

// Retorna ao início
function goHome() {

    practice.style.display = "none";
    grid.style.display = "grid";

    updateCards();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

// Inicialização
createGrid();

</script>

</body>
</html>
