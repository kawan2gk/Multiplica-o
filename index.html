<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prática de Multiplicação | Prof. Gabriel Kawan</title>
<style>
:root {
    --red: #dc2626;
    --yellow: #facc15;
    --green: #16a34a;
    --blue: #2563eb;
    --navy: #172554;
    --background: #f1f5f9;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--background);
    color: #1e293b;
}
header {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: white;
    text-align: center;
    padding: 25px 15px;
}
header h1 { margin: 0 0 9px; font-size: clamp(22px, 4vw, 30px); }
header p { margin: 0; }
main { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
main > h2 { font-size: 21px; margin-bottom: 15px; }
.grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
}
.card {
    border: 0;
    border-radius: 12px;
    padding: 14px 9px;
    text-align: center;
    cursor: pointer;
    color: white;
    background: var(--red);
    box-shadow: 0 3px 6px #0002;
    transition: transform .2s, box-shadow .2s;
    font: inherit;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px #0003; }
.card.yellow { background: var(--yellow); color: #422006; }
.card.green { background: var(--green); color: white; }
.card h2 { font-size: 21px; margin: 0 0 9px; }
.card .preview { font-size: 12px; line-height: 1.55; margin-bottom: 10px; }
.card .status { font-size: 12px; font-weight: bold; border-top: 1px solid #ffffff55; padding-top: 8px; }
.info-card {
    grid-column: span 2;
    background: #dbeafe;
    color: #1e3a8a;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.info-card h3 { margin: 0 0 8px; }
.info-card p { margin: 5px 0; line-height: 1.45; }
.practice-errors {
    grid-column: span 3;
    background: #7c3aed;
    color: white;
    border: 0;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    font-size: 17px;
    font-weight: bold;
}
.practice-errors:hover { background: #6d28d9; }
.practice-errors small { display: inline-block; margin-top: 6px; font-weight: normal; }
#practice {
    display: none;
    max-width: 650px;
    margin: 30px auto;
    background: white;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 5px 20px #0001;
    text-align: center;
}
#practice h2 { margin-top: 0; }
.progress { height: 10px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin: 20px 0; }
#progressBar { width: 0%; height: 100%; background: var(--blue); transition: width .3s; }
#question { font-size: 42px; font-weight: bold; margin: 25px 0; }
.answer-display { margin: 20px auto; max-width: 300px; }
#answer {
    width: 100%;
    padding: 14px;
    font-size: 32px;
    font-weight: bold;
    text-align: center;
    border: 3px solid var(--blue);
    border-radius: 12px;
    background: #eff6ff;
    color: #1e3a8a;
}
.virtual-keyboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 300px;
    margin: 20px auto;
}
.key {
    height: 62px;
    font-size: 25px;
    font-weight: bold;
    border: 0;
    border-radius: 12px;
    background: #e2e8f0;
    color: #1e293b;
    cursor: pointer;
    box-shadow: 0 3px 0 #cbd5e1;
    transition: .12s;
    touch-action: manipulation;
}
.key:hover { background: #cbd5e1; }
.key:active { transform: translateY(3px); box-shadow: none; }
.key-clear { background: #fef3c7; color: #92400e; }
.key-delete { background: #fee2e2; color: #b91c1c; }
.key-confirm {
    grid-column: span 3;
    height: 58px;
    background: var(--green);
    color: white;
    font-size: 18px;
    box-shadow: 0 3px 0 #15803d;
}
.key-confirm:hover { background: #15803d; }
#feedback { min-height: 30px; font-size: 17px; font-weight: bold; margin: 12px 0; }
.actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 8px; padding: 12px 18px; font-size: 16px; font-weight: bold; cursor: pointer; }
.btn-primary { background: var(--blue); color: white; }
.btn-secondary { background: #e2e8f0; color: #1e293b; }
#result { display: none; }
#result h2 { font-size: 27px; }
#resultScore { font-size: 21px; font-weight: bold; }
footer { text-align: center; padding: 23px; margin-top: 30px; background: var(--navy); color: white; }
@media (max-width: 800px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .practice-errors, .info-card { grid-column: span 3; }
}
@media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .practice-errors, .info-card { grid-column: span 2; }
    #practice { padding: 18px 12px; }
    #question { font-size: 35px; }
}
</style>
</head>
<body>
<header>
    <h1>✖ Prática de Multiplicação</h1>
    <p>Aprenda, pratique e domine a tabuada do 0 ao 10!</p>
</header>

<main>
    <h2>📚 Escolha uma tabuada para estudar</h2>
    <div class="grid" id="grid"></div>

    <section id="practice" aria-live="polite">
        <h2 id="practiceTitle">Tabuada</h2>
        <p id="questionCount"></p>
        <div class="progress"><div id="progressBar"></div></div>
        <div id="question"></div>

        <div class="answer-display">
            <input type="text" id="answer" placeholder="Sua resposta"
                   readonly aria-label="Resposta" inputmode="none">
        </div>

        <div id="virtualKeyboard" class="virtual-keyboard" aria-label="Teclado numérico">
            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>
            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>
            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>
            <button class="key key-clear" data-key="clear">C</button>
            <button class="key" data-key="0">0</button>
            <button class="key key-delete" data-key="delete">⌫</button>
            <button class="key key-confirm" id="keyboardConfirm">Confirmar resposta ✓</button>
        </div>

        <div id="feedback"></div>
        <div class="actions">
            <button class="btn btn-secondary" id="backBtn">Voltar ao início</button>
        </div>

        <div id="result">
            <h2>🎉 Prática concluída!</h2>
            <p id="resultScore"></p>
            <p id="resultMessage"></p>
            <div class="actions">
                <button class="btn btn-primary" id="retryBtn">Praticar novamente</button>
                <button class="btn btn-secondary" id="homeBtn">Voltar ao início</button>
            </div>
        </div>
    </section>
</main>

<footer>Desenvolvido: Prof. Gabriel Kawan</footer>

<script>
const grid = document.getElementById("grid");
const practice = document.getElementById("practice");
const question = document.getElementById("question");
const answer = document.getElementById("answer");
const feedback = document.getElementById("feedback");
const questionCount = document.getElementById("questionCount");
const progressBar = document.getElementById("progressBar");
const virtualKeyboard = document.getElementById("virtualKeyboard");
const keyboardConfirm = document.getElementById("keyboardConfirm");
const result = document.getElementById("result");

let currentTable = 1;
let questions = [];
let currentIndex = 0;
let correct = 0;
let mistakes = [];
let errorQuestions = [];
let isChecking = false;

function readStorage(key) {
    try { return JSON.parse(localStorage.getItem(key) || "{}"); }
    catch { return {}; }
}
let progress = readStorage("tabuadaProgress");
let allErrors = readStorage("tabuadaErrors");

function createGrid() {
    grid.innerHTML = "";

    for (let n = 1; n <= 10; n++) {
        const card = document.createElement("button");
        card.className = "card";
        card.id = "card-" + n;

        let preview = "";
        for (let i = 0; i <= 10; i++) {
            preview += `${n} × ${i} = ${n * i}<br>`;
        }

        card.innerHTML = `
            <h2>Tabuada do ${n}</h2>
            <div class="preview">${preview}</div>
            <div class="status" id="status-${n}">Ainda não praticada</div>
        `;
        card.setAttribute("aria-label", `Estudar a tabuada do ${n}`);
        card.addEventListener("click", () => startPractice(n));
        grid.appendChild(card);
    }

    const errorCard = document.createElement("button");
    errorCard.className = "practice-errors";
    errorCard.innerHTML = `🔁 Praticar questões com mais erros<br>
        <small>Reforce o que precisa aprender!</small>`;
    errorCard.addEventListener("click", startErrorPractice);
    grid.appendChild(errorCard);

    const info = document.createElement("div");
    info.className = "info-card";
    info.innerHTML = `
        <h3>🏆 Nosso objetivo!</h3>
        <p>Deixe todas as tabuadas na cor Verde acertando tudo!</p>
        <p>Vermelho: menos da metade.<br>
        Amarelo: pelo menos 50%.<br>
        Verde: 100% de acertos.</p>`;
    grid.appendChild(info);
    updateCards();
}

function updateCards() {
    for (let n = 1; n <= 10; n++) {
        const card = document.getElementById("card-" + n);
        const status = document.getElementById("status-" + n);
        card.classList.remove("yellow", "green");

        const data = progress[n];
        if (!data) {
            status.innerText = "Ainda não praticada";
            continue;
        }
        if (data.percentage === 100) {
            card.classList.add("green");
            status.innerText = "100% de acertos! 🏆";
        } else if (data.percentage >= 50) {
            card.classList.add("yellow");
            status.innerText = data.percentage + "% de acertos";
        } else {
            status.innerText = data.percentage + "% de acertos";
        }
    }
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function startPractice(n) {
    currentTable = n;
    questions = [];

    for (let repetition = 0; repetition < 2; repetition++) {
        for (let i = 0; i <= 10; i++) {
            questions.push({ a: n, b: i, answer: n * i });
        }
    }
    questions = shuffle(questions);
    startSession();
}

function startErrorPractice() {
    const sortedErrors = Object.entries(allErrors)
        .sort((a, b) => b[1] - a[1]);

    if (sortedErrors.length === 0) {
        alert("Ainda não há erros registrados. Pratique uma tabuada primeiro!");
        return;
    }

    errorQuestions = [];
    sortedErrors.slice(0, 10).forEach(([key]) => {
        const [a, b] = key.split("x").map(Number);
        for (let i = 0; i < 2; i++) {
            errorQuestions.push({ a, b, answer: a * b });
        }
    });

    questions = shuffle(errorQuestions);
    currentTable = null;
    startSession();
}

function startSession() {
    currentIndex = 0;
    correct = 0;
    mistakes = [];
    isChecking = false;

    grid.style.display = "none";
    practice.style.display = "block";
    result.style.display = "none";

    document.getElementById("practiceTitle").innerText =
        currentTable !== null
        ? "Tabuada do " + currentTable
        : "Prática das questões com mais erros";

    answer.style.display = "block";
    virtualKeyboard.style.display = "grid";
    showQuestion();

    practice.scrollIntoView({ behavior: "smooth", block: "start" });
}

function showQuestion() {
    const q = questions[currentIndex];
    question.innerText = `${q.a} × ${q.b} = ?`;
    questionCount.innerText = `Questão ${currentIndex + 1} de ${questions.length}`;
    progressBar.style.width = (currentIndex / questions.length * 100) + "%";
    answer.value = "";
    feedback.innerText = "";
    isChecking = false;
    keyboardConfirm.disabled = false;
    keyboardConfirm.style.opacity = "1";
}

function checkAnswer() {
    if (isChecking || currentIndex >= questions.length) return;

    if (answer.value === "") {
        feedback.innerText = "Digite sua resposta usando o teclado!";
        feedback.style.color = "#dc2626";
        return;
    }

    isChecking = true;
    keyboardConfirm.disabled = true;
    keyboardConfirm.style.opacity = ".6";

    const q = questions[currentIndex];
    const key = `${q.a}x${q.b}`;

    if (Number(answer.value) === q.answer) {
        correct++;
        feedback.innerText = "Muito bem! Resposta correta! 🎉";
        feedback.style.color = "#16a34a";
    } else {
        mistakes.push(q);
        allErrors[key] = (allErrors[key] || 0) + 1;
        feedback.innerText = `Ops! A resposta correta é ${q.answer}.`;
        feedback.style.color = "#dc2626";
        localStorage.setItem("tabuadaErrors", JSON.stringify(allErrors));
    }

    setTimeout(() => {
        currentIndex++;
        if (currentIndex < questions.length) {
            showQuestion();
        } else {
            finishPractice();
        }
    }, 900);
}

function finishPractice() {
    const percentage = Math.round((correct / questions.length) * 100);
    progressBar.style.width = "100%";
    questionCount.innerText = "Prática concluída!";
    question.innerText = "🏁";
    answer.style.display = "none";
    virtualKeyboard.style.display = "none";
    result.style.display = "block";

    document.getElementById("resultScore").innerText =
        `${correct} de ${questions.length} acertos (${percentage}%)`;

    document.getElementById("resultMessage").innerText =
        percentage === 100
        ? "Excelente! Você acertou tudo!"
        : percentage >= 50
        ? "Muito bem! Continue praticando para chegar ao verde!"
        : "Não desista! A prática leva à perfeição.";

    if (currentTable !== null) {
        const previous = progress[currentTable];
        // Mantém o melhor resultado já alcançado.
        if (!previous || percentage > previous.percentage) {
            progress[currentTable] = {
                percentage,
                correct,
                total: questions.length
            };
        }
        localStorage.setItem("tabuadaProgress", JSON.stringify(progress));
    }
    updateCards();
}

function goHome() {
    practice.style.display = "none";
    grid.style.display = "grid";
    updateCards();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

virtualKeyboard.querySelectorAll("[data-key]").forEach(button => {
    button.addEventListener("click", () => {
        if (isChecking) return;
        const key = button.dataset.key;

        if (key === "clear") {
            answer.value = "";
        } else if (key === "delete") {
            answer.value = answer.value.slice(0, -1);
        } else if (answer.value.length < 3) {
            answer.value += key;
        }
    });
});

keyboardConfirm.addEventListener("click", checkAnswer);
document.getElementById("backBtn").addEventListener("click", goHome);
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("retryBtn").addEventListener("click", () => {
    if (currentTable !== null) startPractice(currentTable);
    else startErrorPractice();
});

createGrid();
</script>
</body>
</html>
